<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Custom Connect – Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f1e; font-family: 'Inter', system-ui, sans-serif; color: #e0e7ff; display: flex; }
    .sidebar { width: 280px; background: linear-gradient(180deg, #0f172a 0%, #020617 100%); border-right: 1px solid rgba(0, 255, 255, 0.2); min-height: 100vh; padding: 24px 16px; position: sticky; top: 0; }
    .sidebar h2 { font-size: 1.5rem; background: linear-gradient(135deg, #00f2fe, #4facfe); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 32px; text-align: center; }
    .sidebar nav a { display: flex; gap: 12px; padding: 12px 16px; margin: 8px 0; border-radius: 16px; color: #94a3b8; text-decoration: none; transition: 0.2s; }
    .sidebar nav a i { width: 24px; }
    .sidebar nav a:hover, .sidebar nav a.active { background: rgba(0, 255, 255, 0.1); color: #00f2fe; }
    .main { flex: 1; padding: 24px 32px; }
    .card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 24px; padding: 20px; margin-bottom: 28px; }
    input, select, textarea, button { background: #1e293b; border: 1px solid #334155; border-radius: 40px; padding: 10px 18px; color: white; }
    button { background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; font-weight: 700; cursor: pointer; color: #0a0f1e; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 20px; }
    table { width: 100%; border-collapse: collapse; background: #0f172a; border-radius: 20px; overflow: hidden; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #1e293b; font-size: 0.8rem; }
    .footer { text-align: center; font-size: 0.7rem; color: #5b6e8c; margin-top: 40px; }
    @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; min-height: auto; } .main { padding: 16px; } }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="sidebar">
  <h2><i class="fas fa-headset"></i> Agent Portal</h2>
  <nav>
    <a href="#" class="nav-link active" data-section="assignments"><i class="fas fa-inbox"></i> My Cases</a>
    <a href="#" class="nav-link" data-section="templates"><i class="fas fa-file-alt"></i> Templates</a>
    <a href="#" class="nav-link" data-section="notes"><i class="fas fa-sticky-note"></i> My Notes</a>
    <a href="#" class="nav-link" data-section="stats"><i class="fas fa-chart-simple"></i> My Stats</a>
  </nav>
  <div style="margin-top: 40px;"><button onclick="logout()" style="background:#f43f5e; width:100%"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
</div>
<div class="main" id="mainContent"></div>
<div class="footer">Sengxne Tech solutions | Durban — Internal Tool</div>

<script>
  let token = null, currentUser = null;
  async function api(path, opts={}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(path, { ...opts, headers });
    if (!res.ok) throw new Error((await res.json()).error);
    return res.json();
  }
  function logout() { localStorage.clear(); window.location.href='/'; }
  async function loadUser() {
    token = localStorage.getItem('token');
    if (!token) { window.location.href='/'; return; }
    currentUser = JSON.parse(localStorage.getItem('user')||'{}');
    showSection('assignments');
  }
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      showSection(link.dataset.section);
    });
  });
  function showSection(section) {
    if (section === 'assignments') renderAssignments();
    else if (section === 'templates') renderTemplates();
    else if (section === 'notes') renderNotes();
    else if (section === 'stats') renderStats();
  }
  async function renderAssignments() {
    const main = document.getElementById('mainContent');
    main.innerHTML = `<div class="card"><h2>📋 My Assigned Cases</h2><div><input type="text" id="searchAssign" placeholder="Search case #"><select id="filterStatus"><option value="all">All</option><option value="pending">Pending</option><option value="acknowledged">Acknowledged</option><option value="completed">Completed</option><option value="closed">Closed</option></select><button onclick="loadAssignments()">Filter</button></div><div id="assignList"></div></div>`;
    await loadAssignments();
  }
  async function loadAssignments() {
    const status = document.getElementById('filterStatus')?.value || 'all';
    const search = document.getElementById('searchAssign')?.value || '';
    const data = await api(`/api/assignments?status=${status}&search=${encodeURIComponent(search)}`);
    const div = document.getElementById('assignList');
    div.innerHTML = `<table><thead><tr><th>Case #</th><th>Task</th><th>Status</th><th>Resolution</th><th>Action</th></tr></thead><tbody>${data.map(a => `<tr><td>${a.case_number}</td><td>${a.task_type}</td><td>${a.status}</td><td>${a.resolution||'—'}</td><td>${a.status==='pending' ? `<button onclick="acknowledge(${a.id})">Acknowledge</button>` : (a.status==='acknowledged' ? `<button onclick="openWorkModal(${a.id})">Work</button>` : '✅ Done')}</td></tr>`).join('')}</tbody></table>`;
  }
  async function acknowledge(id) { await api('/api/assignment-action?action=acknowledge', { method:'POST', body: JSON.stringify({ assignment_id:id }) }); loadAssignments(); alert('Case acknowledged – you may now work on it.'); }
  async function openWorkModal(id) { const ass = (await api('/api/assignments')).find(a=>a.id===id); if(!ass) return; const modalHtml = `<div id="workModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:1000;"><div style="background:#0f172a; padding:24px; border-radius:24px; width:90%; max-width:500px;"><h3>Case ${ass.case_number}</h3><textarea id="workActions" placeholder="Actions taken *" rows="2">${ass.actions_taken||''}</textarea><textarea id="workComment" placeholder="Comment">${ass.comment||''}</textarea><select id="workResolution"><option>awaiting customer response</option><option>closed</option></select><textarea id="workNotes" placeholder="Private notes">${ass.notes||''}</textarea><div style="margin-top:16px;"><button onclick="submitWork(${id})">Submit</button> <button onclick="closeModal()">Cancel</button></div></div></div>`;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    window.currentAssignId = id;
  }
  async function submitWork(id) {
    const actions = document.getElementById('workActions').value.trim();
    const comment = document.getElementById('workComment').value.trim();
    const resolution = document.getElementById('workResolution').value;
    const notes = document.getElementById('workNotes').value.trim();
    if (!actions) return alert('Actions taken required');
    await api('/api/assignment-action?action=submit', { method:'POST', body: JSON.stringify({ assignment_id:id, resolution, case_fields:{ actions_taken:actions, comment }, notes }) });
    alert('Submitted');
    closeModal();
    loadAssignments();
    renderStats();
  }
  function closeModal() { const modal = document.getElementById('workModal'); if(modal) modal.remove(); }
  async function renderTemplates() {
    const tpl = await api('/api/templates');
    const main = document.getElementById('mainContent');
    main.innerHTML = `<div class="card"><h2>📝 My Templates</h2><div><input id="tplName" placeholder="Name"><textarea id="tplContent" rows="2" placeholder="Content... {input customer name}"></textarea><button onclick="createTemplate()">Save</button></div><div id="tplList"></div></div>`;
    const listDiv = document.getElementById('tplList');
    listDiv.innerHTML = tpl.filter(t=>t.user_id===currentUser.id || t.is_global).map(t => `<div><strong>${t.name}</strong> ${t.is_global?'🌍':''} <button onclick="copyTemplate('${t.content.replace(/'/g,"\\'")}')">copy</button> ${!t.is_global ? `<button onclick="deleteTemplate(${t.id})">delete</button>` : ''}<br><span>${t.content.substring(0,80)}</span></div>`).join('');
  }
  async function createTemplate() { const name=document.getElementById('tplName').value.trim(), content=document.getElementById('tplContent').value.trim(); if(!name||!content) return; await api('/api/templates', { method:'POST', body: JSON.stringify({ name, content, is_global:false }) }); renderTemplates(); }
  async function deleteTemplate(id) { if(confirm('Delete?')){ await api(`/api/templates?id=${id}`, { method:'DELETE' }); renderTemplates(); } }
  function copyTemplate(content) { navigator.clipboard.writeText(content); alert('Copied!'); }
  async function renderNotes() {
    const assignments = await api('/api/assignments');
    const main = document.getElementById('mainContent');
    main.innerHTML = `<div class="card"><h2>📓 My Private Notes (per case)</h2><div id="notesList"></div></div>`;
    const notesDiv = document.getElementById('notesList');
    notesDiv.innerHTML = assignments.map(a => `<div style="border:1px solid #334155; margin-bottom:12px; padding:12px; border-radius:16px;"><strong>Case ${a.case_number}</strong><textarea id="note_${a.id}" rows="2" placeholder="Your notes...">${a.notes||''}</textarea><button onclick="saveNote(${a.id})">Save Note</button></div>`).join('');
  }
  async function saveNote(id) { const note = document.getElementById(`note_${id}`).value; await api('/api/assignment-action?action=submit', { method:'POST', body: JSON.stringify({ assignment_id:id, resolution:'awaiting customer response', case_fields:{}, notes:note }) }); alert('Note saved'); }
  async function renderStats() {
    const assignments = await api('/api/assignments');
    const closedToday = assignments.filter(a => a.status==='closed' && new Date(a.closed_at).toDateString()===new Date().toDateString()).length;
    const pending = assignments.filter(a=>a.status==='pending').length;
    const awaiting = assignments.filter(a=>a.resolution==='awaiting customer response').length;
    const main = document.getElementById('mainContent');
    main.innerHTML = `<div class="card"><h2>📊 My Performance</h2><div class="grid-2"><div>✅ Cases closed today: ${closedToday}</div><div>⏳ Pending acknowledgment: ${pending}</div><div>📬 Awaiting response: ${awaiting}</div><div>🏆 Total assigned: ${assignments.length}</div></div></div>`;
  }
  window.onload = loadUser;
</script>
</body>
</html>
