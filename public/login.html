<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Connect – Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0b2b3b, #1a4a6f); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 28px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; color: #0b2b3b; }
    .sub { color: #5f7f9e; margin-bottom: 28px; font-size: 0.85rem; }
    input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 1rem; margin-bottom: 16px; outline: none; }
    button { width: 100%; background: #1a4a6f; color: white; border: none; padding: 12px; border-radius: 40px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .error { color: #d9534f; margin-top: 12px; font-size: 0.85rem; text-align: center; }
    .brand-footer { text-align: center; margin-top: 24px; font-size: 0.7rem; color: #8ba0b5; }
  </style>
</head>
<body>
<div class="card">
  <h1>Custom Connect</h1>
  <div class="sub">Internal tool – Agent & Admin login</div>
  <input type="text" id="username" placeholder="Username (full name)">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div id="errorMsg" class="error"></div>
  <div class="brand-footer">Sengxne Tech solutions | Durban</div>
</div>
<script>
  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMsg');
    if (!username || !password) { errorDiv.innerText = 'Please fill both fields'; return; }
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      if (data.user.role === 'admin') window.location.href = '/admin';
      else window.location.href = '/agent';
    } catch (err) {
      errorDiv.innerText = err.message;
    }
  }
  window.onload = () => { if (localStorage.getItem('token')) window.location.href = '/agent'; };
</script>
</body>
</html>
