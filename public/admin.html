<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Custom Connect – Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0f1e;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #e0e7ff;
      display: flex;
    }
    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
      border-right: 1px solid rgba(0, 255, 255, 0.2);
      min-height: 100vh;
      padding: 24px 16px;
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
    }
    .sidebar h2 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 32px;
      text-align: center;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 16px;
      color: #94a3b8;
      text-decoration: none;
      transition: all 0.2s;
      font-weight: 500;
    }
    .sidebar nav a i { width: 24px; }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: rgba(0, 255, 255, 0.1);
      color: #00f2fe;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
    }
    /* MAIN CONTENT */
    .main {
      flex: 1;
      padding: 24px 32px;
      overflow-x: auto;
    }
    /* CARDS & NEON */
    .card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 28px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: 0.2s;
    }
    .card:hover {
      border-color: #00f2fe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
    }
    h1, h2, h3 {
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff, #00f2fe);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    input, select, textarea, button {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 40px;
      padding: 10px 18px;
      color: white;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 8px #00f2fe;
    }
    button {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border: none;
      font-weight: 700;
      cursor: pointer;
      color: #0a0f1e;
    }
    button.danger {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
    }
    .grid-2, .grid-3 {
      display: grid;
      gap: 20px;
    }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #0f172a;
      border-radius: 20px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #1e293b;
      font-size: 0.8rem;
    }
    th { color: #00f2fe; font-weight: 600; }
    .badge {
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: #5b6e8c;
      margin-top: 40px;
      padding: 16px;
    }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; min-height: auto; position: relative; }
      .main { padding: 16px; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="sidebar">
  <h2><i class="fas fa-bolt"></i> Custom Connect</h2>
  <nav>
    <a href="#" class="nav-link active" data-section="dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a href="#" class="nav-link" data-section="cases"><i class="fas fa-tasks"></i> Cases & Assignments</a>
    <a href="#" class="nav-link" data-section="agents"><i class="fas fa-users"></i> Agents</a>
    <a href="#" class="nav-link" data-section="templates"><i class="fas fa-file-alt"></i> Templates</a>
    <a href="#" class="nav-link" data-section="audit"><i class="fas fa-history"></i> Audit Log</a>
  </nav>
  <div style="margin-top: 40px;"><button onclick="logout()" class="danger" style="width:100%"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
</div>
<div class="main" id="mainContent"></div>
<div class="footer">Sengxne Tech solutions | Durban — Internal Tool</div>

<script>
  let token = null, currentUser = null;
  const API_BASE = '';
  async function api(path, opts={}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(API_BASE + path, { ...opts, headers });
    if (!res.ok) throw new Error((await res.json()).error);
    return res.json();
  }
  function logout() { localStorage.clear(); window.location.href='/'; }
  async function loadUser() {
    const t = localStorage.getItem('token');
    if (!t) { window.location.href='/'; return; }
    token = t;
    currentUser = JSON.parse(localStorage.getItem('user')||'{}');
    if (currentUser.role !== 'admin') { window.location.href='/agent'; return; }
    showSection('dashboard');
  }

  // Navigation
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      showSection(link.dataset.section);
    });
  });

  function showSection(section) {
    const main = document.getElementById('mainContent');
    if (section === 'dashboard') renderDashboard();
    else if (section === 'cases') renderCases();
    else if (section === 'agents') renderAgents();
    else if (section === 'templates') renderTemplates();
    else if (section === 'audit') renderAudit();
  }

  async function renderDashboard() {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="card"><h2>📊 Loading targets...</h2></div>';
    try {
      const dept = 'Customer Service';
      const targets = await api(`/api/targets?department=${dept}`);
      const assignments = await api('/api/assignments');
      const completedToday = assignments.filter(a => a.status==='closed' && new Date(a.closed_at).toDateString()===new Date().toDateString()).length;
      const pendingAssign = assignments.filter(a => a.status==='pending').length;
      const agents = await api('/api/users');
      const leaderboard = await api(`/api/targets?department=${dept}`);
      main.innerHTML = `
        <div class="grid-3">
          <div class="card"><h3>🎯 Daily Target</h3><div style="font-size:2rem;">${targets.target||0}</div><div>cases to close</div><div>✅ Completed: ${targets.completed||0}</div><div>📉 Remaining: ${targets.remaining||0}</div><button onclick="setTarget()">Set New Target</button></div>
          <div class="card"><h3>📋 Today's Activity</h3><div>Closed: ${completedToday}</div><div>Pending assignments: ${pendingAssign}</div><div>Active agents: ${agents.length}</div></div>
          <div class="card"><h3>🏆 Leaderboard</h3><div id="leaderList"></div></div>
        </div>
        <div class="card"><h3>⚡ Quick Actions</h3><div class="grid-2"><button onclick="createCase()">+ New Case</button><button onclick="autoAssign()">⚙️ Auto Distribute</button></div></div>
      `;
      const leaderDiv = document.getElementById('leaderList');
      if (leaderboard.leaderboard && leaderboard.leaderboard.length) {
        leaderDiv.innerHTML = leaderboard.leaderboard.map(l => `<div>${l.full_name}: ${l.closed_count} closed</div>`).join('');
      } else { leaderDiv.innerHTML = '<div>No data yet</div>'; }
    } catch(e) { main.innerHTML = `<div class="card">Error: ${e.message}</div>`; }
  }

  async function renderCases() {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
      <div class="card"><h2>📋 Manage Cases & Assignments</h2>
        <div class="grid-2"><input type="text" id="caseNumber" placeholder="Case number *"><input type="text" id="accountNumber" placeholder="Account number"><select id="taskType"><option>Water Order</option><option>Chase</option><option>Amend</option></select><button onclick="createCase()">Create Case</button></div>
        <div style="margin:20px 0;"><h3>Manual Assign</h3><select id="assignCase"></select><select id="assignAgent"></select><button onclick="manualAssign()">Assign</button></div>
        <div><h3>Auto Dispatch</h3><select id="autoDept"><option>Customer Service</option></select><input type="number" id="autoCount" placeholder="Number of cases"><button onclick="autoAssign()">Auto Distribute</button></div>
        <hr style="margin:20px 0;border-color:#334155;"><div><input type="text" id="searchCase" placeholder="Search case #"><select id="filterStatus"><option value="all">All status</option><option value="pending">Pending</option><option value="acknowledged">Acknowledged</option><option value="completed">Completed</option><option value="closed">Closed</option></select><button onclick="loadAssignmentsTable()">Filter</button></div>
        <div style="overflow-x:auto;"><table id="assignTable"><thead><tr><th>Case #</th><th>Agent</th><th>Status</th><th>Resolution</th><th>Actions</th></tr></thead><tbody></tbody></table></div>
      </div>
    `;
    await loadUnassignedCases();
    await loadAgentsForAssign();
    await loadAssignmentsTable();
  }

  async function loadUnassignedCases() {
    const res = await api('/api/cases');
    const select = document.getElementById('assignCase');
    select.innerHTML = '<option>Select case</option>' + res.map(c => `<option value="${c.id}">${c.case_number}</option>`).join('');
  }
  async function loadAgentsForAssign() {
    const res = await api('/api/users');
    const select = document.getElementById('assignAgent');
    select.innerHTML = '<option>Select agent</option>' + res.map(u => `<option value="${u.id}">${u.full_name}</option>`).join('');
  }
  async function loadAssignmentsTable() {
    const status = document.getElementById('filterStatus')?.value || 'all';
    const search = document.getElementById('searchCase')?.value || '';
    const data = await api(`/api/assignments?status=${status}&search=${encodeURIComponent(search)}`);
    const tbody = document.querySelector('#assignTable tbody');
    tbody.innerHTML = data.map(a => `<tr><td>${a.case_number}</td><td>${a.agent_name}</td><td>${a.status}</td><td>${a.resolution||'—'}</td><td><button onclick="reassign(${a.id})">Reassign</button></td></tr>`).join('');
  }
  async function manualAssign() {
    const caseId = document.getElementById('assignCase').value;
    const agentId = document.getElementById('assignAgent').value;
    if (!caseId || !agentId) return alert('Select case and agent');
    await api('/api/assignments', { method:'POST', body: JSON.stringify({ case_ids:[caseId], agent_id:agentId }) });
    alert('Assigned');
    loadUnassignedCases(); loadAssignmentsTable();
  }
  async function autoAssign() {
    const dept = document.getElementById('autoDept')?.value || 'Customer Service';
    const count = parseInt(document.getElementById('autoCount')?.value);
    if (!count) return alert('Enter number of cases');
    await api('/api/assignments?auto=true', { method:'POST', body: JSON.stringify({ department:dept, number_of_cases:count }) });
    alert('Auto dispatch completed');
    loadAssignmentsTable(); renderDashboard();
  }
  async function createCase() {
    const case_number = document.getElementById('caseNumber')?.value.trim();
    if (!case_number) return alert('Case number required');
    await api('/api/cases', { method:'POST', body: JSON.stringify({ case_number, account_number:document.getElementById('accountNumber')?.value, task_type:document.getElementById('taskType')?.value }) });
    alert('Case created');
    document.getElementById('caseNumber').value='';
    loadUnassignedCases();
  }
  async function reassign(id) {
    await api(`/api/assignments?id=${id}`, { method:'DELETE' });
    loadAssignmentsTable();
  }

  async function renderAgents() {
    const agents = await api('/api/users');
    const main = document.getElementById('mainContent');
    main.innerHTML = `<div class="card"><h2>👥 Manage Agents</h2><div class="grid-2"><input id="agentName" placeholder="Full name"><select id="agentDept"><option>Customer Service</option></select><input id="maxCases" placeholder="Max open cases (50)"><button onclick="createAgent()">Create Agent (auto password)</button></div><div id="agentsList"></div></div>`;
    const listDiv = document.getElementById('agentsList');
    listDiv.innerHTML = agents.map(a => `<div style="padding:8px;border-bottom:1px solid #334155;">${a.full_name} | Dept: ${a.department} | Max: ${a.max_open_cases} | Active: ${a.is_active?'✅':'❌'} <button onclick="toggleAgent(${a.id},${!a.is_active})">${a.is_active?'Disable':'Enable'}</button></div>`).join('');
  }
  async function createAgent() {
    const full_name = document.getElementById('agentName').value.trim();
    if (!full_name) return alert('Name required');
    const res = await api('/api/auth/register', { method:'POST', body: JSON.stringify({ full_name, department:document.getElementById('agentDept').value, max_open_cases:document.getElementById('maxCases').value || 50 }) });
    alert(`Agent ${res.full_name} created. Password: ${res.password}`);
    renderAgents();
  }
  async function toggleAgent(id, newStatus) {
    await api(`/api/users?id=${id}`, { method:'PATCH', body: JSON.stringify({ is_active:newStatus }) });
    renderAgents();
  }

  async function renderTemplates() {
    const templates = await api('/api/templates');
    const main = document.getElementById('mainContent');
    main.innerHTML = `<div class="card"><h2>📝 Global Templates</h2><div><input id="globalTplName" placeholder="Name"><textarea id="globalTplContent" rows="2" placeholder="Content... {input customer name}"></textarea><button onclick="createGlobalTemplate()">Save</button></div><div id="tplList"></div></div>`;
    const listDiv = document.getElementById('tplList');
    listDiv.innerHTML = templates.filter(t=>t.is_global).map(t => `<div style="margin:8px 0;"><strong>${t.name}</strong> <button onclick="copyTemplate('${t.content.replace(/'/g,"\\'")}')">copy</button> <button onclick="deleteTemplate(${t.id})">delete</button><br><span>${t.content.substring(0,80)}</span></div>`).join('');
  }
  async function createGlobalTemplate() {
    const name = document.getElementById('globalTplName').value.trim();
    const content = document.getElementById('globalTplContent').value.trim();
    if (!name || !content) return;
    await api('/api/templates', { method:'POST', body: JSON.stringify({ name, content, is_global:true }) });
    renderTemplates();
  }
  async function deleteTemplate(id) { if(confirm('Delete?')){ await api(`/api/templates?id=${id}`, { method:'DELETE' }); renderTemplates(); } }
  function copyTemplate(content) { navigator.clipboard.writeText(content); alert('Copied!'); }

  async function renderAudit() { const logs = await api('/api/audit'); const main = document.getElementById('mainContent'); main.innerHTML = `<div class="card"><h2>📜 Audit Log</h2><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${l.user_id}</td><td>${l.action}</td><td>${JSON.stringify(l.details)}</td></tr>`).join('')}</tbody></table></div>`; }

  function setTarget() { const t = prompt('New daily target for Customer Service:'); if(t) api('/api/targets', { method:'POST', body: JSON.stringify({ department:'Customer Service', target_cases:parseInt(t) }) }).then(()=>renderDashboard()); }

  window.onload = loadUser;
</script>
</body>
</html>
